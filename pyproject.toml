[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "groundcheck"
version = "1.0.0"
description = "A deterministic groundedness linter for RAG/LLM answers — flags fabricated numbers, unsupported claims, and broken citations, with exit codes for CI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohamed Mohsen" }]
keywords = ["llm", "rag", "hallucination", "groundedness", "ai", "evaluation", "citations", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
groundcheck = "groundcheck.cli:main"

[project.urls]
Homepage = "https://github.com/RootX22/groundcheck"
Issues = "https://github.com/RootX22/groundcheck/issues"

[tool.setuptools.packages.find]
include = ["groundcheck*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
